# Server-блок для системного nginx (sites-available/preferans).
# Проксирует на контейнер app (127.0.0.1:8097). TLS добавит certbot --nginx.
#
#   cp deploy/nginx/preferans.conf /etc/nginx/sites-available/preferans
#   ln -s /etc/nginx/sites-available/preferans /etc/nginx/sites-enabled/preferans
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d artemshaer.ru

map $http_upgrade $preferans_conn_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name artemshaer.ru;

    location / {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket игры (/ws): держим соединение, пока идёт партия
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $preferans_conn_upgrade;
        proxy_read_timeout 3600s;
    }
}
